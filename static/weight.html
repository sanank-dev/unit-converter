<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weight Converter</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            width: 100%;
            max-width: 520px;
            margin: 20px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #ff4757, #ff6348);
            color: white;
            padding: 25px;
            text-align: center;
        }
        .header h1 { font-size: 2.2rem; margin-bottom: 8px; }
        .form-container { padding: 40px 30px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
        input, select {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
        }
        input:focus, select:focus {
            border-color: #ff4757;
            box-shadow: 0 0 0 3px rgba(255, 71, 87, 0.1);
        }
        .result {
            margin-top: 30px;
            padding: 25px;
            background: #fff8f8;
            border-radius: 12px;
            border: 2px solid #ffe6e6;
            text-align: center;
            min-height: 100px;
        }
        .result-value {
            font-size: 2.2rem;
            font-weight: bold;
            color: #ff4757;
        }
        .back-btn {
            margin-top: 20px;
            padding: 12px 25px;
            background: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚖️ Weight Converter</h1>
            <p>Instant conversion • No reload</p>
        </div>

        <div class="form-container">
            <label>Value</label>
            <input type="number" id="value" step="any" placeholder="Enter value" oninput="convert()">

            <label>From</label>
            <select id="from" onchange="convert()">
                <option value="mg">Milligram (mg)</option>
                <option value="g" selected>Gram (g)</option>
                <option value="kg">Kilogram (kg)</option>
                <option value="ton">Metric Ton (t)</option>
                <option value="lb">Pound (lb)</option>
                <option value="oz">Ounce (oz)</option>
            </select>

            <label>To</label>
            <select id="to" onchange="convert()">
                <option value="mg">Milligram (mg)</option>
                <option value="g">Gram (g)</option>
                <option value="kg" selected>Kilogram (kg)</option>
                <option value="ton">Metric Ton (t)</option>
                <option value="lb">Pound (lb)</option>
                <option value="oz">Ounce (oz)</option>
            </select>

            <div class="result" id="result">
                <h2>Result</h2>
                <div class="result-value" id="result-value">0</div>
            </div>

            <center>
                <a href="/" class="back-btn">← Back to Home</a>
            </center>
        </div>
    </div>

    <script>
        function convert() {
            let value = parseFloat(document.getElementById('value').value);
            const from = document.getElementById('from').value;
            const to = document.getElementById('to').value;

            if (!value || isNaN(value)) {
                document.getElementById('result-value').textContent = "0";
                return;
            }

            // Convert to Gram (base unit)
            let grams = value;
            switch(from) {
                case "mg": grams = value / 1000; break;
                case "g": grams = value; break;
                case "kg": grams = value * 1000; break;
                case "ton": grams = value * 1000000; break;
                case "lb": grams = value * 453.59237; break;
                case "oz": grams = value * 28.349523125; break;
            }

            // Convert Gram to target unit
            let result = grams;
            switch(to) {
                case "mg": result = grams * 1000; break;
                case "g": result = grams; break;
                case "kg": result = grams / 1000; break;
                case "ton": result = grams / 1000000; break;
                case "lb": result = grams / 453.59237; break;
                case "oz": result = grams / 28.349523125; break;
            }

            document.getElementById('result-value').textContent = result.toFixed(4);
        }
    </script>
</body>
</html>
