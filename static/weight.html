<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weight Converter</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            width: 100%;
            max-width: 520px;
            margin: 20px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #ff4757, #ff6348);
            color: white;
            padding: 25px;
            text-align: center;
        }
        .header h1 {
            font-size: 2.2rem;
            margin-bottom: 8px;
        }
        .form-container {
            padding: 40px 30px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        input, select {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
        }
        input:focus, select:focus {
            border-color: #ff4757;
            outline: none;
            box-shadow: 0 0 0 3px rgba(255, 71, 87, 0.1);
        }
        button {
            width: 100%;
            padding: 16px;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #ff3742;
            transform: translateY(-2px);
        }
        .result {
            margin-top: 30px;
            padding: 20px;
            background: #fff8f8;
            border-radius: 12px;
            border: 2px solid #ffe6e6;
            min-height: 80px;
            text-align: center;
        }
        .result-value {
            font-size: 2rem;
            font-weight: bold;
            color: #ff4757;
        }
        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 50px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚖️ Weight Converter</h1>
            <p>Convert between different weight units</p>
        </div>

        <div class="form-container">
            <form action="/weight" method="POST">
                <label>Value</label>
                <input type="number" step="any" name="value" placeholder="Enter value" required>

                <label>From</label>
                <select name="from" required>
                    <option value="">-- Select Unit --</option>
                    <option value="mg">Milligram (mg)</option>
                    <option value="g" selected>Gram (g)</option>
                    <option value="kg">Kilogram (kg)</option>
                    <option value="ton">Metric Ton (t)</option>
                    <option value="lb">Pound (lb)</option>
                    <option value="oz">Ounce (oz)</option>
                </select>

                <label>To</label>
                <select name="to" required>
                    <option value="">-- Select Unit --</option>
                    <option value="mg">Milligram (mg)</option>
                    <option value="g">Gram (g)</option>
                    <option value="kg" selected>Kilogram (kg)</option>
                    <option value="ton">Metric Ton (t)</option>
                    <option value="lb">Pound (lb)</option>
                    <option value="oz">Ounce (oz)</option>
                </select>

                <button type="submit">Convert Now</button>
            </form>

            <div class="result">
                <h2>Result</h2>
                {{ if .result }}
                    <div class="result-value">{{ .result }}</div>
                {{ else }}
                    <div style="color:#888; font-style:italic;">Enter value and click Convert</div>
                {{ end }}
            </div>

            <center>
                <a href="/" class="back-btn">← Back to Home</a>
            </center>
        </div>
    </div>
</body>
</html>
