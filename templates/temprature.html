<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Length Converter</title>
    <link rel="stylesheet" href="/static/css/style.css">
  
</head>
<body style="background: linear-gradient(135deg, #d18282 0%, #aa506ee3 100%);">
    <div class="container">
        <div class="header" style=" background: linear-gradient(135deg, #d18282, #aa506ee3);">
            <h1>🌡️ Temperature Converter</h1>
            <p>Instant conversion • No reload</p>
        </div>

        <div class="form-container">
            <label>Value</label>
            <input type="number" id="value" step="any" placeholder="Enter value" oninput="convert()">

            <label>From</label>
            <select id="from" onchange="convert()">
               <option value="c" selected>Celsius (°C)</option>
                <option value="f">Fahrenheit (°F)</option>
                <option value="k">Kelvin (K)</option>
            </select>

            <label>To</label>
            <select id="to" onchange="convert()">
             <option value="c" >Celsius (°C)</option>
                <option value="f" selected>Fahrenheit (°F)</option>
                <option value="k">Kelvin (K)</option>
            </select>

            <div class="result" id="result">
                <h2>Result</h2>
                <div class="result-value" id="result-value">0</div>
            </div>

            <center>
                <a href="/" class="back-btn">← Back to Home</a>
            </center>
        </div>
    </div>

    <script src="/static/js/temprature.js"> </script>
</body>
</html>
