<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weight Converter</title>
    <link rel="stylesheet" href="/static/css/weight.css">


</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚖️ Weight Converter</h1>
            <p>Instant conversion • No reload</p>
        </div>

        <div class="form-container">
            <label>Value</label>
            <input type="number" id="value" step="any" placeholder="Enter value" oninput="convert()">

            <label>From</label>
            <select id="from" onchange="convert()">
                <option value="mg">Milligram (mg)</option>
                <option value="g" selected>Gram (g)</option>
                <option value="kg">Kilogram (kg)</option>
                <option value="ton">Metric Ton (t)</option>
                <option value="lb">Pound (lb)</option>
                <option value="oz">Ounce (oz)</option>
            </select>

            <label>To</label>
            <select id="to" onchange="convert()">
                <option value="mg">Milligram (mg)</option>
                <option value="g">Gram (g)</option>
                <option value="kg" selected>Kilogram (kg)</option>
                <option value="ton">Metric Ton (t)</option>
                <option value="lb">Pound (lb)</option>
                <option value="oz">Ounce (oz)</option>
            </select>

            <div class="result" id="result">
                <h2>Result</h2>
                <div class="result-value" id="result-value">0</div>
            </div>

            <center>
                <a href="/" class="back-btn">← Back to Home</a>
            </center>
        </div>
    </div>

    <script src="/static/js/weight.js"> </script>
</body>
</html>
